<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dominic Eggs | Faszination Polarlichter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        :root {
            --bg-color: #060913;
            --text-main: #f0f4f8;
            --accent-green: #2ef2a0;
            --accent-purple: #bc6ff1;
            --glow: 0 0 20px rgba(46, 242, 160, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-bg-image {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background: url('Polarlichter_Hintergrund.png') no-repeat center center/cover;
            z-index: 1;
            animation: auroraMovement 20s ease-in-out infinite alternate;
        }

        .hero-bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(6, 9, 19, 0.1) 0%, rgba(6, 9, 19, 0.4) 60%, var(--bg-color) 100%);
            z-index: 2;
        }

        @keyframes auroraMovement {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-15px, 10px) scale(1.03) rotate(0.5deg); }
            100% { transform: translate(15px, -5px) scale(1.01) rotate(-0.5deg); }
        }

        .content {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 40px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            letter-spacing: 4px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #fff 30%, var(--accent-green) 70%, var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: var(--glow);
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="hero-bg-image"></div>
    <div class="hero-bg-overlay"></div>

    <div class="content">
        <h1>Faszination der Polarlichter</h1>
        <div class="subtitle">Projekt aktuell geschlossen</div>
    </div>

</body>
</html>
